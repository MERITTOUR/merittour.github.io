<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>안내 문서 · 메리트투어</title>
<meta name="description" content="메리트투어에서 보내 드린 견적서 · 확정서를 확인하는 페이지입니다. 제목 줄을 눌러 접고 펼칠 수 있으며 인쇄도 됩니다.">
<!-- 링크 미리보기(카카오톡·문자) — 공통 로고 카드 /assets/og-logo.jpg 1200×630 · 문서 내용은 미리보기에 싣지 않는다 -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="메리트투어 · MERITTOUR">
<meta property="og:title" content="안내 문서">
<meta property="og:description" content="메리트투어에서 보내 드린 견적서 · 확정서를 확인하는 페이지입니다. 제목 줄을 눌러 접고 펼칠 수 있으며 인쇄도 됩니다.">
<meta property="og:url" content="https://merittour.github.io/doc/">
<meta property="og:image" content="https://merittour.github.io/assets/og-logo.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="ko_KR">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<meta name="theme-color" content="#1a2740">
<style>
  /* 손님 열람 페이지 — 사내 도구 「닐라이 견적·확정서」가 올린 열람 조각(서명 링크 ?d=)을 받아 보여 준다 (2026-10-02 · Min 「너무 긴 내용들은 접고 펴고 할 수 있고 인쇄도」).
     문서의 모양은 조각 안의 <style>(전부 .doc 아래)이 정하고, 이 페이지는 머리·버튼·만료 안내만 맡는다. 팔레트는 /about/docs/ 와 같은 네이비. */
  :root{ --ink:#1a2740; --muted:#6a7a92; --line:#e0e4ec; --bg:#f1f3f6; --gold:#c9b489;
    --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","맑은 고딕","Malgun Gothic",sans-serif; }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.6;font-size:16px;word-break:keep-all;-webkit-text-size-adjust:100%}
  a{color:inherit}
  .top{background:var(--ink);color:#fff;padding:14px 16px}
  .top .in{max-width:760px;margin:0 auto;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .top .brand{font-size:12px;letter-spacing:.14em;color:var(--gold);font-weight:700}
  .top h1{margin:0;font-size:18px;font-weight:800}
  .bar{max-width:760px;margin:12px auto 0;padding:0 12px;display:flex;gap:8px;flex-wrap:wrap}
  .bar button{font:inherit;font-size:15px;font-weight:700;min-height:44px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;flex:1 1 auto}
  .bar button.p{background:var(--ink);color:#fff;border-color:var(--ink)}
  .hint{max-width:760px;margin:6px auto 0;padding:0 14px;font-size:13px;color:var(--muted)}
  #doc{max-width:760px;margin:12px auto 0;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .loading{padding:40px 16px;text-align:center;color:var(--muted)}
  .err{padding:36px 20px;text-align:center}
  .err b{font-size:18px;display:block;margin-bottom:8px}
  .err p{margin:6px 0;color:var(--muted);font-size:15px}
  .err .c{color:var(--ink);margin-top:14px}
  body.is-err .bar, body.is-err .hint{display:none}
  .until{max-width:760px;margin:10px auto 40px;padding:0 14px;font-size:13px;color:var(--muted);text-align:center}
  @media print{
    body{background:#fff}
    .top,.bar,.hint,.until{display:none}
    #doc{max-width:none;margin:0;border:none;border-radius:0}
    @page{margin:12mm}
  }
</style>
</head>
<body>
<header class="top"><div class="in"><span class="brand">MERITTOUR</span><h1 id="kind">안내 문서</h1></div></header>
<div class="bar" id="bar">
  <button type="button" id="bOpen">모두 펼치기</button>
  <button type="button" id="bClose">모두 접기</button>
  <button type="button" id="bPrint" class="p">인쇄</button>
</div>
<p class="hint" id="hint">제목 줄을 누르면 그 부분을 펼치거나 접을 수 있습니다. 인쇄는 전부 펼쳐서 됩니다.</p>
<main id="doc"><div class="loading">문서를 불러오는 중입니다…</div></main>
<p class="until" id="until"></p>
<script>
(function () {
  /* 우리 Supabase 프로젝트의 confirm-docs 서명 주소(.html)만 연다 — 다른 주소를 넣어 이 도메인에 남의 HTML 을 띄우는 것(가짜 입금 계좌 등)을 막는다. */
  var ALLOW = /^https:\/\/mbfmiynwycvhsoepdnxe\.supabase\.co\/storage\/v1\/object\/sign\/confirm-docs\/[A-Za-z0-9_\-\/]+\.html\?token=[A-Za-z0-9_\-.]+$/;
  var src = new URLSearchParams(location.search).get('d') || '';
  var box = document.getElementById('doc'), kindEl = document.getElementById('kind'), untilEl = document.getElementById('until'), hint = document.getElementById('hint');
  if (/KAKAOTALK/i.test(navigator.userAgent)) hint.textContent += ' 인쇄가 되지 않으면 오른쪽 위 메뉴에서 「다른 브라우저로 열기」를 눌러 주세요.';

  function fail(title, body) {
    document.body.classList.add('is-err');
    box.innerHTML = '<div class="err"><b>' + title + '</b><p>' + body + '</p><p class="c">㈜메리트투어 <a href="tel:0223659800">02-365-9800</a> (평일 09:00~18:00) · 카카오톡 채널 「메리트투어」</p></div>';
  }
  function fmt(iso) { var m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? (+m[1]) + '년 ' + (+m[2]) + '월 ' + (+m[3]) + '일' : iso; }
  /* 우리 버킷에서 온 문서만 열지만, 그래도 스크립트 · 이벤트 속성 · 이상한 주소는 떼고 넣는다 */
  function clean(root) {
    root.querySelectorAll('script,iframe,object,embed,link,meta,form,input,button,base').forEach(function (e) { e.remove(); });
    root.querySelectorAll('*').forEach(function (e) {
      Array.prototype.slice.call(e.attributes).forEach(function (a) {
        var n = a.name.toLowerCase(), v = a.value.trim();
        if (n.indexOf('on') === 0 || ((n === 'href' || n === 'src' || n === 'xlink:href') && !/^(https?:|tel:|mailto:|data:image\/)/i.test(v))) e.removeAttribute(a.name);
      });
    });
  }

  if (!ALLOW.test(src)) { fail('문서 주소가 올바르지 않습니다', '메리트투어에서 보내 드린 링크를 그대로 눌러 주세요.'); return; }
  fetch(src, { cache: 'no-store' }).then(function (r) {
    if (!r.ok) throw new Error('gone');
    return r.text();
  }).then(function (html) {
    var dp = new DOMParser().parseFromString(html, 'text/html');
    clean(dp);
    var doc = dp.querySelector('.doc');
    if (!doc) throw new Error('gone');
    box.innerHTML = '';
    dp.querySelectorAll('style').forEach(function (s) { box.appendChild(document.adoptNode(s)); });
    box.appendChild(document.adoptNode(doc));
    var kind = doc.getAttribute('data-kind') || '안내 문서';
    kindEl.textContent = kind; document.title = kind + ' · 메리트투어';
    var u = doc.getAttribute('data-until');
    if (u) untilEl.textContent = '이 문서는 ' + fmt(u) + '까지 열람하실 수 있습니다. 그 뒤에 다시 보시려면 담당자에게 말씀해 주세요.';
    document.body.classList.add('is-doc');
  }).catch(function (e) {
    if (e && e.message === 'gone') fail('문서를 열 수 없습니다', '열람 기간이 지났거나 주소가 올바르지 않습니다. 다시 받아 보시려면 담당자에게 말씀해 주세요.');
    else fail('문서를 불러오지 못했습니다', '인터넷 연결을 확인하신 뒤 다시 열어 주세요.');
  });

  /* 접기 · 펼치기 · 인쇄 — 인쇄는 전부 펼쳐서 하고(접힌 부분이 빠진 채 인쇄되지 않게) 끝나면 보던 대로 되돌린다 */
  function dets() { return Array.prototype.slice.call(box.querySelectorAll('details')); }
  var was = null, printing = false;
  function all(open) { printing = false; was = null; dets().forEach(function (d) { d.open = open; }); }
  function beforePrint() { if (printing) return; printing = true; was = dets().map(function (d) { return d.open; }); dets().forEach(function (d) { d.open = true; }); }
  function afterPrint() { if (!printing) return; printing = false; var w = was || []; was = null; dets().forEach(function (d, i) { d.open = w[i] !== false; }); }
  window.addEventListener('beforeprint', beforePrint);
  window.addEventListener('afterprint', afterPrint);
  document.getElementById('bOpen').addEventListener('click', function () { all(true); });
  document.getElementById('bClose').addEventListener('click', function () { all(false); });
  document.getElementById('bPrint').addEventListener('click', function () { printing = false; beforePrint(); setTimeout(function () { window.print(); }, 60); });
})();
</script>
</body>
</html>
