<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>메리트투어 | MERITTOUR</title>
<meta name="description" content="메리트투어 — 일본 프리미엄 골프 리조트 회원 안내">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700;900&family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --navy: #1e2a3d;
    --navy-deep: #121a28;
    --navy-dark: #0c121d;
    --gold: #c79a4e;
    --gold-light: #e0bd7a;
    --gold-deep: #9a7634;
    --cream: #f3ecda;
    --cream-dim: #c9c2ae;
  }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--navy-dark);
    color: var(--cream);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 18px;
    background-image:
      radial-gradient(ellipse 70% 50% at 50% 0%, rgba(224,189,122,0.10) 0%, transparent 60%),
      radial-gradient(ellipse 80% 60% at 50% 100%, rgba(30,42,61,0.6) 0%, transparent 70%);
  }
  .gate {
    width: 100%;
    max-width: 540px;
    text-align: center;
    background: linear-gradient(180deg, var(--navy-deep) 0%, var(--navy) 100%);
    border: 1px solid var(--gold-deep);
    border-radius: 6px;
    padding: 56px 32px 44px;
    position: relative;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .gate::before {
    content: '';
    position: absolute;
    inset: 7px;
    border: 1px solid rgba(199,154,78,0.4);
    border-radius: 3px;
    pointer-events: none;
  }
  .brand-mark {
    font-family: 'Noto Serif KR', serif;
    font-size: 12px;
    letter-spacing: 0.5em;
    color: var(--gold);
    margin-bottom: 22px;
  }
  .brand-mark::before, .brand-mark::after { content: '◆'; margin: 0 12px; font-size: 8px; opacity: 0.7; }
  h1 {
    font-family: 'Noto Serif KR', serif;
    font-size: 46px;
    font-weight: 900;
    letter-spacing: 0.04em;
    color: var(--gold-light);
    line-height: 1.1;
    text-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  .brand-en {
    font-family: 'Noto Serif KR', serif;
    font-size: 13px;
    letter-spacing: 0.42em;
    color: var(--cream-dim);
    margin-top: 12px;
    padding-left: 0.42em;
  }
  .gate-divider {
    display: flex; align-items: center; justify-content: center;
    gap: 12px; margin: 26px 0;
  }
  .gate-divider .line { width: 56px; height: 1px; background: var(--gold); opacity: 0.55; }
  .gate-divider .mark { color: var(--gold); font-size: 11px; }
  .gate-desc {
    font-size: 14.5px;
    color: var(--cream-dim);
    line-height: 1.85;
    margin-bottom: 34px;
  }
  .gate-desc strong { color: var(--cream); font-weight: 600; }
  .enter-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 16px 38px;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-deep) 100%);
    color: var(--navy-dark);
    font-family: 'Noto Serif KR', serif;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-decoration: none;
    border-radius: 4px;
    box-shadow: 0 6px 20px rgba(199,154,78,0.25);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .enter-btn:hover, .enter-btn:active {
    transform: translateY(-2px);
    box-shadow: 0 10px 26px rgba(199,154,78,0.4);
  }
  .enter-btn .arrow { transition: transform 0.2s; }
  .enter-btn:hover .arrow { transform: translateX(4px); }
  .gate-contact {
    margin-top: 36px;
    padding-top: 22px;
    border-top: 1px solid rgba(199,154,78,0.18);
    font-size: 12px;
    color: var(--cream-dim);
    line-height: 1.9;
  }
  .gate-contact strong { color: var(--gold-light); font-size: 14px; letter-spacing: 0.04em; }
  @media (max-width: 480px) {
    .gate { padding: 44px 20px 34px; }
    h1 { font-size: 36px; }
    .enter-btn { width: 100%; justify-content: center; }
  }
</style>
</head>
<body>
<main class="gate">
  <div class="brand-mark">MERITTOUR</div>
  <h1>메리트투어</h1>
  <div class="brand-en">PREMIUM GOLF RESORT</div>

  <div class="gate-divider">
    <span class="line"></span><span class="mark">◆</span><span class="line"></span>
  </div>

  <div class="gate-desc">
    메리트투어가 엄선한 <strong>일본 프리미엄 골프 리조트</strong>를<br>
    회원 여러분께 안내해 드립니다.
  </div>

  <a href="guide/" class="enter-btn">
    리조트 안내 들어가기 <span class="arrow">→</span>
  </a>

  <div class="gate-contact">
    ㈜메리트투어 회원예약센터<br>
    <strong>02 · 365 · 9800</strong> &nbsp;|&nbsp; 평일 09:00 ~ 18:00
  </div>
</main>
</body>
</html>
